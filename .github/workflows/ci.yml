name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate site and sandbox adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Lint site
        run: npm run lint

      - name: Test and build site
        run: npm test

      - name: Install sandbox adapter dependencies
        working-directory: sandbox-adapter
        run: npm ci

      - name: Typecheck sandbox adapter
        working-directory: sandbox-adapter
        run: npm run typecheck

      - name: Test sandbox adapter
        working-directory: sandbox-adapter
        run: npm test
